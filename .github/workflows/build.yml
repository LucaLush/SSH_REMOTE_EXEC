name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # 质量门禁：构建前执行自动化单元测试。任何测试不通过则立即中断流水线，坚决不构建发布缺陷 APK
      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace || {
            echo "::error::Unit Tests Failed!"
            echo "=== Printing Test XML Results ==="
            find app/build/test-results -name "*.xml" -exec cat {} +
            exit 1
          }

      # 测试报告归档（无论成功失败均归档，方便在线查看详情）
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTest-Report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 1. 方式一：上传到 Actions 制品库 (Artifacts)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHRemoteExec-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 2. 方式二：直接发布到 GitHub Releases，仓库首页右侧可一键直接下载 APK
      - name: Publish Latest Debug APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SSH Remote Exec (Latest Continuous Build)"
          body: "云端自动构建的最新开发版 APK，点击下方 Assets 中的 app-debug.apk 直接下载安装。"
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 检查是否有配置 Release 签名环境变量
      - name: Prepare Signing Key for Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "No signing keystore found in secrets."
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SSHRemoteExec-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 打正式版本 Tag 时自动发布 Release
      - name: Create Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
