name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Quality Gate: Run automated unit tests before packaging. Fail fast if any tests fail.
      - name: Run Unit Tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle_test.log

      - name: Report Test Failure Details
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          python3 -c "
          import os, glob, xml.etree.ElementTree as ET
          has_xml = False
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              tree = ET.parse(f)
              for tc in tree.findall('.//testcase'):
                  for fail in tc.findall('failure'):
                      has_xml = True
                      msg = fail.attrib.get('message', '').replace('\n', ' ')
                      lines = [line.strip() for line in (fail.text or '').split('\n') if line.strip()]
                      detail = lines[0] if lines else ''
                      cname = tc.attrib.get('classname', '')
                      mname = tc.attrib.get('name', '')
                      print(f'::error title=Failed: {cname}.{mname}::{msg} | {detail}')
          if not has_xml and os.path.exists('gradle_test.log'):
              with open('gradle_test.log') as f:
                  lines = [l.strip() for l in f.readlines() if l.strip()]
              kt_errs = [l for l in lines if l.startswith('e: ') or ': error:' in l]
              if kt_errs:
                  snippet = ' \n '.join(kt_errs[:5])
                  print(f'::error title=Kotlin Compile Error::{snippet[:1000]}')
              else:
                  errs = [l for l in lines if 'e: ' in l or 'FAILED' in l or 'Exception' in l or 'Caused by' in l]
                  snippet = ' ; '.join(errs[-8:] if errs else lines[-12:])
                  print(f'::error title=Gradle Build Error::{snippet[:1000]}')
          "

      # Archive test reports (uploaded regardless of success or failure for online inspection)
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTest-Report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Prepare Signing Key for Release if configured in secrets
      - name: Prepare Signing Key for Release
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.jks
          else
            echo "No custom release keystore secret found; Gradle will use shared release signing configuration."
          fi

      - name: Build Debug & Release APKs
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      # 1. Upload Artifacts to Actions
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHRemoteExec-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHRemoteExec-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 2. Formal Milestone Release on Tag push (e.g., v1.0.0)
      - name: Publish Official Milestone Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SSH Remote Exec ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Rolling Release on Main branch push
      - name: Publish Rolling Build to GitHub Releases
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SSH Remote Exec (Latest Build)"
          body: "Automated continuous build of the latest commit on `main`. Download `app-release.apk` for the optimized production build or `app-debug.apk` for development testing."
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
